name: stats

# Refreshes the contribution graph + language share from GitHub, then commits
# the snapshot and the regenerated SVGs. Runs nightly; pushes from this job use
# GITHUB_TOKEN, which does not trigger other workflows, so it cannot loop.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/src/build-stats.mjs"
      - "assets/src/stats.json"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch GitHub data and rebuild the card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node assets/src/build-stats.mjs --fetch

      - name: Commit when the card changed
        run: |
          # GitHub's language byte counts settle asynchronously and can move by a
          # handful of bytes without changing a single pixel. Only commit when the
          # rendered card actually differs.
          if git diff --quiet -- 'assets/activity-*.svg'; then
            echo "No rendered change; leaving the snapshot alone."
            git checkout -- assets/src/stats.json
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/src/stats.json assets/activity-*.svg
          git commit -m "chore(stats): refresh contribution graph and language share"
          git push
