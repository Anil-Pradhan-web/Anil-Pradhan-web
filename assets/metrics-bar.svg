<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-label="Anil Pradhan Verified Engineering Metrics">
  <title>Anil Pradhan — Key Engineering Metrics</title>
  <defs>
    <radialGradient id="hudGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0b0c10" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#e3b341" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="100%" stop-color="#e50914" />
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card -->
  <rect x="0.5" y="0.5" width="1199" height="129" rx="8" fill="#0b0c10" stroke="#8a181a" stroke-width="1.2" stroke-opacity="0.55" />
  <rect x="1" y="1" width="1198" height="128" rx="7" fill="url(#hudGlow)" />

  <!-- Hawkins Retro Corner Accents -->
  <path d="M12 26 L12 12 L26 12" stroke="#e50914" stroke-width="1.8" fill="none" stroke-linecap="square" />
  <path d="M1174 12 L1188 12 L1188 26" stroke="#e50914" stroke-width="1.8" fill="none" stroke-linecap="square" />
  <path d="M12 104 L12 118 L26 118" stroke="#e50914" stroke-width="1.8" fill="none" stroke-linecap="square" />
  <path d="M1174 118 L1188 118 L1188 104" stroke="#e50914" stroke-width="1.8" fill="none" stroke-linecap="square" />

  <!-- Column Dividers -->
  <line x1="300" y1="20" x2="300" y2="110" stroke="#8a181a" stroke-opacity="0.35" stroke-dasharray="3 3" />
  <line x1="600" y1="20" x2="600" y2="110" stroke="#8a181a" stroke-opacity="0.35" stroke-dasharray="3 3" />
  <line x1="900" y1="20" x2="900" y2="110" stroke="#8a181a" stroke-opacity="0.35" stroke-dasharray="3 3" />

  <!-- Column 1: Dell Hackathon -->
  <g text-anchor="middle">
    <text x="150" y="54" font-family="'Segoe UI Variable Display','Segoe UI','Inter',sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="url(#goldGrad)">Top 6</text>
    <text x="150" y="78" font-family="'Cascadia Mono','SF Mono','JetBrains Mono',monospace" font-size="11.5" font-weight="600" letter-spacing="1.8" fill="#f0f4f8">OF 8,000+ TEAMS</text>
    <text x="150" y="98" font-family="'Cascadia Mono','SF Mono','JetBrains Mono',monospace" font-size="10" font-weight="500" letter-spacing="1.2" fill="#8b949e">DELL FUTUREMINDS 2026</text>
  </g>

  <!-- Column 2: Academics -->
  <g text-anchor="middle">
    <text x="450" y="54" font-family="'Segoe UI Variable Display','Segoe UI','Inter',sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#f0f4f8">8.93</text>
    <text x="450" y="78" font-family="'Cascadia Mono','SF Mono','JetBrains Mono',monospace" font-size="11.5" font-weight="600" letter-spacing="1.8" fill="#f0f4f8">CGPA / 10.0</text>
    <text x="450" y="98" font-family="'Cascadia Mono','SF Mono','JetBrains Mono',monospace" font-size="10" font-weight="500" letter-spacing="1.2" fill="#8b949e">B.TECH COMPUTER SCIENCE</text>
  </g>

  <!-- Column 3: LeetCode -->
  <g text-anchor="middle">
    <text x="750" y="54" font-family="'Segoe UI Variable Display','Segoe UI','Inter',sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="url(#redGrad)">218+</text>
    <text x="750" y="78" font-family="'Cascadia Mono','SF Mono','JetBrains Mono',monospace" font-size="11.5" font-weight="600" letter-spacing="1.8" fill="#f0f4f8">DSA PROBLEMS SOLVED</text>
    <text x="750" y="98" font-family="'Cascadia Mono','SF Mono','JetBrains Mono',monospace" font-size="10" font-weight="500" letter-spacing="1.2" fill="#8b949e">LEETCODE VERIFIED</text>
  </g>

  <!-- Column 4: HackerRank -->
  <g text-anchor="middle">
    <text x="1050" y="54" font-family="'Segoe UI Variable Display','Segoe UI','Inter',sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="url(#goldGrad)">4★</text>
    <text x="1050" y="78" font-family="'Cascadia Mono','SF Mono','JetBrains Mono',monospace" font-size="11.5" font-weight="600" letter-spacing="1.8" fill="#f0f4f8">JAVA MASTERY</text>
    <text x="1050" y="98" font-family="'Cascadia Mono','SF Mono','JetBrains Mono',monospace" font-size="10" font-weight="500" letter-spacing="1.2" fill="#8b949e">HACKERRANK CERTIFIED</text>
  </g>
</svg>
