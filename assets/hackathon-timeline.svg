<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="850" height="450">
  <defs>
    <!-- Gold glow filter for Dell node -->
    <filter id="gold-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Background -->
  <rect x="1" y="1" width="848" height="448" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- ===== VERTICAL TIMELINE LINE ===== -->
  <line x1="80" y1="40" x2="80" y2="400" stroke="#30363d" stroke-width="2" stroke-dasharray="360" stroke-dashoffset="360">
    <animate attributeName="stroke-dashoffset" from="360" to="0" dur="2s" begin="0.3s" fill="freeze"/>
  </line>

  <!-- ===== NODE 1 — Dell FutureMinds (GOLD HIGHLIGHT) ===== -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.5s" fill="freeze"/>

    <!-- Node circle with glow -->
    <circle cx="80" cy="60" r="8" fill="#F5A623" filter="url(#gold-glow)" style="animation: pulse-glow 2.5s ease-in-out infinite"/>

    <!-- Connector line -->
    <line x1="92" y1="60" x2="108" y2="60" stroke="#F5A623" stroke-width="1.5" opacity="0.5"/>

    <!-- Badge background for "GRAND FINALIST" -->
    <rect x="108" y="39" width="335" height="24" rx="4" fill="#F5A623" opacity="0.12"/>

    <!-- Title -->
    <text x="115" y="56" fill="#F5A623" font-size="15" font-weight="bold" font-family="'Segoe UI', sans-serif">Dell FutureMinds AI 2026</text>

    <!-- Subtitle -->
    <text x="115" y="76" fill="#c9d1d9" font-size="12" font-family="'Segoe UI', sans-serif">🥇 Grand Finalist · Top 6 / 8,000+</text>

    <!-- Detail -->
    <text x="115" y="93" fill="#8b949e" font-size="11" font-family="'Segoe UI', sans-serif">Multi-agent vision inspection pipeline</text>

    <!-- Small gold accent bar -->
    <rect x="115" y="98" width="0" height="1.5" rx="1" fill="#F5A623" opacity="0.4">
      <animate attributeName="width" from="0" to="220" dur="0.8s" begin="0.8s" fill="freeze"/>
    </rect>
  </g>

  <!-- ===== NODE 2 — iQOO ===== -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.0s" fill="freeze"/>

    <!-- Node circle -->
    <circle cx="80" cy="155" r="6" fill="#00E5FF"/>

    <!-- Connector line -->
    <line x1="90" y1="155" x2="108" y2="155" stroke="#00E5FF" stroke-width="1" opacity="0.4"/>

    <!-- Title -->
    <text x="115" y="151" fill="#00E5FF" font-size="14" font-weight="bold" font-family="'Segoe UI', sans-serif">iQOO Hackathon 2026</text>

    <!-- Subtitle -->
    <text x="115" y="170" fill="#8b949e" font-size="11" font-family="'Segoe UI', sans-serif">Builder · On-Device Intelligence</text>
  </g>

  <!-- ===== NODE 3 — Microsoft ===== -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.5s" fill="freeze"/>

    <!-- Node circle -->
    <circle cx="80" cy="235" r="6" fill="#00E5FF"/>

    <!-- Connector line -->
    <line x1="90" y1="235" x2="108" y2="235" stroke="#00E5FF" stroke-width="1" opacity="0.4"/>

    <!-- Title -->
    <text x="115" y="231" fill="#00E5FF" font-size="14" font-weight="bold" font-family="'Segoe UI', sans-serif">Microsoft AI Dev Days</text>

    <!-- Subtitle -->
    <text x="115" y="250" fill="#8b949e" font-size="11" font-family="'Segoe UI', sans-serif">Builder · Azure OpenAI + Copilot</text>
  </g>

  <!-- ===== NODE 4 — Amazon ===== -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.0s" fill="freeze"/>

    <!-- Node circle -->
    <circle cx="80" cy="315" r="6" fill="#00E5FF"/>

    <!-- Connector line -->
    <line x1="90" y1="315" x2="108" y2="315" stroke="#00E5FF" stroke-width="1" opacity="0.4"/>

    <!-- Title -->
    <text x="115" y="311" fill="#00E5FF" font-size="14" font-weight="bold" font-family="'Segoe UI', sans-serif">Amazon Nova Hackathon</text>

    <!-- Subtitle -->
    <text x="115" y="330" fill="#8b949e" font-size="11" font-family="'Segoe UI', sans-serif">Builder · AWS Bedrock Multimodal</text>
  </g>

  <!-- ===== NODE 5 — Google ===== -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.5s" fill="freeze"/>

    <!-- Node circle -->
    <circle cx="80" cy="395" r="6" fill="#00E5FF"/>

    <!-- Connector line -->
    <line x1="90" y1="395" x2="108" y2="395" stroke="#00E5FF" stroke-width="1" opacity="0.4"/>

    <!-- Title -->
    <text x="115" y="391" fill="#00E5FF" font-size="14" font-weight="bold" font-family="'Segoe UI', sans-serif">Google Solution Challenge</text>

    <!-- Subtitle -->
    <text x="115" y="410" fill="#8b949e" font-size="11" font-family="'Segoe UI', sans-serif">Builder · Gemini + Cloud APIs</text>
  </g>
</svg>
