<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480">
  <defs>
    <!-- Gold glow filter for Dell node -->
    <filter id="gold-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="dell-banner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #F5A623); }
    }
    .mono { font-family: 'SF Mono', Monaco, 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Shell -->
  <rect x="1" y="1" width="858" height="478" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>

  <!-- Top System Header Track -->
  <text x="80" y="32" class="mono" font-size="11" font-weight="bold" fill="#8b949e" letter-spacing="2">NATIONAL HACKATHON &amp; COMPETITION TIMELINE</text>
  <rect x="620" y="18" width="180" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
  <text x="710" y="33" text-anchor="middle" class="mono" font-size="10" fill="#00E5FF" font-weight="600">5 HACKATHONS LOGGED</text>
  <line x1="80" y1="46" x2="800" y2="46" stroke="#30363d" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- ===== VERTICAL TIMELINE LINE ===== -->
  <line x1="80" y1="65" x2="80" y2="445" stroke="#30363d" stroke-width="2.5" stroke-dasharray="380" stroke-dashoffset="380">
    <animate attributeName="stroke-dashoffset" from="380" to="0" dur="1.8s" begin="0.2s" fill="freeze"/>
  </line>

  <!-- ===== NODE 1 — Dell FutureMinds (GOLD HIGHLIGHT) ===== -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.4s" fill="freeze"/>

    <!-- Glowing gold pulse circle -->
    <circle cx="80" cy="85" r="9" fill="#F5A623" filter="url(#gold-glow)" style="animation: pulse-glow 2.5s ease-in-out infinite"/>
    <line x1="92" y1="85" x2="110" y2="85" stroke="#F5A623" stroke-width="1.8" opacity="0.6"/>

    <!-- Highlight Card Background -->
    <rect x="110" y="62" width="690" height="58" rx="6" fill="url(#dell-banner)" stroke="#F5A623" stroke-width="0.8" stroke-opacity="0.4"/>

    <!-- Title and Badges -->
    <text x="125" y="82" fill="#F5A623" font-size="15" font-weight="bold" class="sans">&#x1F947; Dell FutureMinds AI Hackathon 2026</text>
    <rect x="420" y="69" width="165" height="18" rx="4" fill="#00E89D" fill-opacity="0.15" />
    <text x="502" y="82" text-anchor="middle" fill="#00E89D" font-size="10" font-weight="bold" class="mono">NATIONAL GRAND FINALIST</text>

    <!-- Subtitle & Commendation -->
    <text x="125" y="103" fill="#c9d1d9" font-size="12" class="sans">Top 6 Nationwide / 8,000+ Students &#x2022; Pitched Live at Dell Technologies Bengaluru HQ</text>
    <text x="125" y="117" fill="#8b949e" font-size="11" class="sans">Multi-agent vision anomaly detection pipeline with vector embeddings running in &lt; 5s</text>
  </g>

  <!-- ===== NODE 2 — iQOO ===== -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.0s" fill="freeze"/>
    <circle cx="80" cy="170" r="6" fill="#00E5FF"/>
    <line x1="88" y1="170" x2="110" y2="170" stroke="#00E5FF" stroke-width="1.2" opacity="0.4"/>

    <text x="115" y="166" fill="#00E5FF" font-size="14" font-weight="bold" class="sans">&#x26A1; iQOO Hackathon 2026</text>
    <rect x="290" y="153" width="70" height="17" rx="3" fill="#00E5FF" fill-opacity="0.12"/>
    <text x="325" y="165" text-anchor="middle" fill="#00E5FF" font-size="10" class="mono">BUILDER</text>
    <text x="115" y="184" fill="#8b949e" font-size="11" class="sans">High-Performance Computing &amp; On-Device Machine Intelligence Architectures</text>
  </g>

  <!-- ===== NODE 3 — Microsoft ===== -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.5s" fill="freeze"/>
    <circle cx="80" cy="245" r="6" fill="#00E5FF"/>
    <line x1="88" y1="245" x2="110" y2="245" stroke="#00E5FF" stroke-width="1.2" opacity="0.4"/>

    <text x="115" y="241" fill="#00E5FF" font-size="14" font-weight="bold" class="sans">&#x1F537; Microsoft AI Dev Days</text>
    <rect x="290" y="228" width="70" height="17" rx="3" fill="#00E5FF" fill-opacity="0.12"/>
    <text x="325" y="240" text-anchor="middle" fill="#00E5FF" font-size="10" class="mono">BUILDER</text>
    <text x="115" y="259" fill="#8b949e" font-size="11" class="sans">Autonomous Agentic Prototypes leveraging Azure OpenAI, Semantic Search &amp; Copilot</text>
  </g>

  <!-- ===== NODE 4 — Amazon ===== -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.0s" fill="freeze"/>
    <circle cx="80" cy="320" r="6" fill="#00E5FF"/>
    <line x1="88" y1="320" x2="110" y2="320" stroke="#00E5FF" stroke-width="1.2" opacity="0.4"/>

    <text x="115" y="316" fill="#00E5FF" font-size="14" font-weight="bold" class="sans">&#x1F7E7; Amazon Nova Hackathon</text>
    <rect x="300" y="303" width="70" height="17" rx="3" fill="#00E5FF" fill-opacity="0.12"/>
    <text x="335" y="315" text-anchor="middle" fill="#00E5FF" font-size="10" class="mono">BUILDER</text>
    <text x="115" y="334" fill="#8b949e" font-size="11" class="sans">High-Throughput Inference Workflows with Amazon Nova &amp; AWS Bedrock Foundation Models</text>
  </g>

  <!-- ===== NODE 5 — Google ===== -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.5s" fill="freeze"/>
    <circle cx="80" cy="395" r="6" fill="#00E5FF"/>
    <line x1="88" y1="395" x2="110" y2="395" stroke="#00E5FF" stroke-width="1.2" opacity="0.4"/>

    <text x="115" y="391" fill="#00E5FF" font-size="14" font-weight="bold" class="sans">&#x1F310; Google Solution Challenge</text>
    <rect x="310" y="378" width="70" height="17" rx="3" fill="#00E5FF" fill-opacity="0.12"/>
    <text x="345" y="390" text-anchor="middle" fill="#00E5FF" font-size="10" class="mono">BUILDER</text>
    <text x="115" y="409" fill="#8b949e" font-size="11" class="sans">Multimodal Gemini Pipelines &amp; Resilient Serverless Microservices on Google Cloud</text>
  </g>
</svg>
