<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 730" width="920" height="730">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #00E89D); }
    }
    .node-box {
      transition: all 0.3s ease;
      cursor: default;
    }
    .mono { font-family: 'SF Mono', Monaco, 'Fira Code', 'Courier New', monospace; }
    .hud-text { font-family: 'SF Mono', Monaco, 'Fira Code', monospace; font-size: 11px; letter-spacing: 1.5px; }
    .col-title { font-family: 'SF Mono', Monaco, 'Fira Code', monospace; font-size: 13px; font-weight: bold; letter-spacing: 2px; }
    .node-title { font-family: 'SF Mono', Monaco, 'Fira Code', monospace; font-size: 12px; font-weight: 600; text-anchor: middle; dominant-baseline: central; fill: #e6edf3; }
    .node-sub { font-family: 'SF Mono', Monaco, 'Fira Code', monospace; font-size: 9px; text-anchor: middle; dominant-baseline: central; fill: #8b949e; }
  </style>

  <!-- Background Canvas -->
  <rect x="1" y="1" width="918" height="728" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />

  <!-- Top System Header -->
  <g transform="translate(0, 15)">
    <text x="460" y="22" text-anchor="middle" class="mono" font-size="12" fill="#58a6ff" font-weight="bold" letter-spacing="3">&#x2694; SYSTEM ARCHITECTURE // SKILL MATRIX</text>
    <text x="460" y="38" text-anchor="middle" class="hud-text" fill="#8b949e">KERNEL: DISTRIBUTED &amp; AGENTIC INFRASTRUCTURE &#x2022; ACTIVE NODES: 24/24</text>
    <line x1="80" y1="48" x2="840" y2="48" stroke="#30363d" stroke-width="0.8" stroke-dasharray="4 4" />
  </g>

  <!-- ==================== CONNECTING BUS LINES ==================== -->

  <!-- Trunk from Python to Java -->
  <path d="M 400 95 C 330 95, 270 120, 270 145" fill="none" stroke="#F5A623" stroke-width="1.8" stroke-opacity="0.6" stroke-dasharray="200" stroke-dashoffset="200">
    <animate attributeName="stroke-dashoffset" from="200" to="0" dur="0.8s" begin="0.3s" fill="freeze" />
  </path>

  <!-- Trunk from Python to TypeScript -->
  <path d="M 520 95 C 590 95, 650 120, 650 145" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.6" stroke-dasharray="200" stroke-dashoffset="200">
    <animate attributeName="stroke-dashoffset" from="200" to="0" dur="0.8s" begin="0.3s" fill="freeze" />
  </path>

  <!-- Trunk from Python straight down to Backend Pillar -->
  <line x1="460" y1="115" x2="460" y2="210" stroke="#00E89D" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.6s" begin="0.5s" fill="freeze" />
  </line>

  <!-- Trunk from Java to AI Pillar -->
  <path d="M 230 180 C 200 195, 175 200, 175 220" fill="none" stroke="#c084fc" stroke-width="1.6" stroke-opacity="0.5" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.6s" begin="0.8s" fill="freeze" />
  </path>

  <!-- Trunk from TypeScript to DevOps Pillar -->
  <path d="M 690 180 C 720 195, 745 200, 745 220" fill="none" stroke="#f97316" stroke-width="1.6" stroke-opacity="0.5" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.6s" begin="0.8s" fill="freeze" />
  </path>

  <!-- Vertical Bus Line - AI Column (x=175) -->
  <line x1="175" y1="240" x2="175" y2="600" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="360" stroke-dashoffset="360">
    <animate attributeName="stroke-dashoffset" from="360" to="0" dur="1.2s" begin="1.0s" fill="freeze" />
  </line>

  <!-- Vertical Bus Line - Backend Column (x=460) -->
  <line x1="460" y1="240" x2="460" y2="580" stroke="#00E89D" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="340" stroke-dashoffset="340">
    <animate attributeName="stroke-dashoffset" from="340" to="0" dur="1.2s" begin="1.0s" fill="freeze" />
  </line>

  <!-- Vertical Bus Line - DevOps Column (x=745) -->
  <line x1="745" y1="240" x2="745" y2="600" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="360" stroke-dashoffset="360">
    <animate attributeName="stroke-dashoffset" from="360" to="0" dur="1.2s" begin="1.0s" fill="freeze" />
  </line>

  <!-- ==================== LAYER 1: ROOT KERNEL ==================== -->
  <g transform="translate(370, 75)" filter="url(#glow-cyan)">
    <rect x="0" y="0" width="180" height="42" rx="10" fill="#161b22" stroke="#00E5FF" stroke-width="2" />
    <circle cx="20" cy="21" r="5" fill="#00E5FF" />
    <text x="100" y="16" class="mono" font-size="14" font-weight="bold" fill="#00E5FF" text-anchor="middle">PYTHON 3.12</text>
    <text x="100" y="31" class="mono" font-size="9" fill="#8b949e" text-anchor="middle">[Primary Kernel / Core Engine]</text>
  </g>

  <!-- ==================== LAYER 2: FOUNDATIONS ==================== -->
  <!-- Java Node -->
  <g transform="translate(190, 145)" filter="url(#glow-amber)">
    <rect x="0" y="0" width="140" height="36" rx="8" fill="#161b22" stroke="#F5A623" stroke-width="1.5" />
    <circle cx="16" cy="18" r="4" fill="#F5A623" />
    <text x="78" y="18" class="mono" font-size="12" font-weight="bold" fill="#F5A623" text-anchor="middle">JAVA 23 (Loom)</text>
  </g>

  <!-- TypeScript Node -->
  <g transform="translate(590, 145)">
    <rect x="0" y="0" width="140" height="36" rx="8" fill="#161b22" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="16" cy="18" r="4" fill="#38bdf8" />
    <text x="78" y="18" class="mono" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">TYPESCRIPT</text>
  </g>

  <!-- ==================== PILLAR HEADERS ==================== -->
  <text x="175" y="235" text-anchor="middle" class="col-title" fill="#c084fc">&#x1F916; AI &amp; AGENTIC SYSTEMS</text>
  <text x="460" y="235" text-anchor="middle" class="col-title" fill="#00E89D">&#x2699; BACKEND &amp; DATA SYSTEMS</text>
  <text x="745" y="235" text-anchor="middle" class="col-title" fill="#f97316">&#x2601; DEVOPS &amp; RUNTIME</text>

  <!-- ==================== PILLAR 1: AI & AGENTIC (LEFT: x=105 to 245) ==================== -->

  <!-- Node 1: LangGraph -->
  <g transform="translate(100, 255)" filter="url(#glow-purple)">
    <rect x="0" y="0" width="150" height="34" rx="7" fill="#161b22" stroke="#a855f7" stroke-width="1.4" />
    <text x="75" y="17" class="node-title">LangGraph</text>
  </g>

  <!-- Node 2: Google Gemini -->
  <g transform="translate(100, 307)">
    <rect x="0" y="0" width="150" height="34" rx="7" fill="#161b22" stroke="#a855f7" stroke-width="1.4" />
    <text x="75" y="17" class="node-title">Gemini 1.5 Pro</text>
  </g>

  <!-- Node 3: Groq LPU -->
  <g transform="translate(100, 359)">
    <rect x="0" y="0" width="150" height="34" rx="7" fill="#161b22" stroke="#a855f7" stroke-width="1.4" />
    <text x="75" y="17" class="node-title">Groq LPU (Ultra-Fast)</text>
  </g>

  <!-- Node 4: Claude / MCP -->
  <g transform="translate(100, 411)">
    <rect x="0" y="0" width="150" height="34" rx="7" fill="#161b22" stroke="#a855f7" stroke-width="1.4" />
    <text x="75" y="17" class="node-title">Claude / MCP Protocol</text>
  </g>

  <!-- Node 5: PyTorch -->
  <g transform="translate(100, 463)">
    <rect x="0" y="0" width="150" height="34" rx="7" fill="#161b22" stroke="#a855f7" stroke-width="1.4" />
    <text x="75" y="17" class="node-title">PyTorch (Deep Learning)</text>
  </g>

  <!-- Node 6: YOLO11n -->
  <g transform="translate(100, 515)">
    <rect x="0" y="0" width="150" height="34" rx="7" fill="#161b22" stroke="#a855f7" stroke-width="1.4" />
    <text x="75" y="17" class="node-title">YOLO11n + OpenCV</text>
  </g>

  <!-- Node 7: ChromaDB & FAISS -->
  <g transform="translate(100, 567)">
    <rect x="0" y="0" width="150" height="34" rx="7" fill="#161b22" stroke="#a855f7" stroke-width="1.4" />
    <text x="75" y="17" class="node-title">ChromaDB &amp; FAISS</text>
  </g>

  <!-- ==================== PILLAR 2: BACKEND & DATA (CENTER: x=380 to 540) ==================== -->

  <!-- Node 1: FastAPI -->
  <g transform="translate(380, 255)" filter="url(#glow-emerald)">
    <rect x="0" y="0" width="160" height="34" rx="7" fill="#161b22" stroke="#00E89D" stroke-width="1.5" />
    <text x="80" y="17" class="node-title">FastAPI (High Throughput)</text>
  </g>

  <!-- Node 2: WebSockets -->
  <g transform="translate(380, 311)">
    <rect x="0" y="0" width="160" height="34" rx="7" fill="#161b22" stroke="#00E89D" stroke-width="1.3" />
    <text x="80" y="17" class="node-title">WebSockets &amp; AsyncIO</text>
  </g>

  <!-- Node 3: SQLAlchemy 2.0 -->
  <g transform="translate(380, 367)">
    <rect x="0" y="0" width="160" height="34" rx="7" fill="#161b22" stroke="#00E89D" stroke-width="1.3" />
    <text x="80" y="17" class="node-title">SQLAlchemy 2.0 (ORM)</text>
  </g>

  <!-- Node 4: PostgreSQL -->
  <g transform="translate(380, 423)">
    <rect x="0" y="0" width="160" height="34" rx="7" fill="#161b22" stroke="#00E89D" stroke-width="1.3" />
    <text x="80" y="17" class="node-title">PostgreSQL (Neon Cloud)</text>
  </g>

  <!-- Node 5: Redis -->
  <g transform="translate(380, 479)">
    <rect x="0" y="0" width="160" height="34" rx="7" fill="#161b22" stroke="#00E89D" stroke-width="1.3" />
    <text x="80" y="17" class="node-title">Redis (Distributed Cache)</text>
  </g>

  <!-- Node 6: State DAGs -->
  <g transform="translate(380, 535)">
    <rect x="0" y="0" width="160" height="34" rx="7" fill="#161b22" stroke="#00E89D" stroke-width="1.3" />
    <text x="80" y="17" class="node-title">Deterministic State DAGs</text>
  </g>

  <!-- ==================== PILLAR 3: DEVOPS & RUNTIME (RIGHT: x=665 to 825) ==================== -->

  <!-- Node 1: Docker -->
  <g transform="translate(665, 255)">
    <rect x="0" y="0" width="160" height="34" rx="7" fill="#161b22" stroke="#f97316" stroke-width="1.4" />
    <text x="80" y="17" class="node-title">Docker Containers</text>
  </g>

  <!-- Node 2: GitHub Actions -->
  <g transform="translate(665, 307)">
    <rect x="0" y="0" width="160" height="34" rx="7" fill="#161b22" stroke="#f97316" stroke-width="1.4" />
    <text x="80" y="17" class="node-title">GitHub Actions CI/CD</text>
  </g>

  <!-- Node 3: Next.js 14 -->
  <g transform="translate(665, 359)">
    <rect x="0" y="0" width="160" height="34" rx="7" fill="#161b22" stroke="#f97316" stroke-width="1.4" />
    <text x="80" y="17" class="node-title">Next.js 14 &amp; React 19</text>
  </g>

  <!-- Node 4: Tailwind & Vite -->
  <g transform="translate(665, 411)">
    <rect x="0" y="0" width="160" height="34" rx="7" fill="#161b22" stroke="#f97316" stroke-width="1.4" />
    <text x="80" y="17" class="node-title">Tailwind CSS &amp; Vite</text>
  </g>

  <!-- Node 5: Pytest -->
  <g transform="translate(665, 463)">
    <rect x="0" y="0" width="160" height="34" rx="7" fill="#161b22" stroke="#f97316" stroke-width="1.4" />
    <text x="80" y="17" class="node-title">Pytest (Automated Evals)</text>
  </g>

  <!-- Node 6: Prometheus -->
  <g transform="translate(665, 515)">
    <rect x="0" y="0" width="160" height="34" rx="7" fill="#161b22" stroke="#f97316" stroke-width="1.4" />
    <text x="80" y="17" class="node-title">Prometheus Telemetry</text>
  </g>

  <!-- Node 7: Linux -->
  <g transform="translate(665, 567)">
    <rect x="0" y="0" width="160" height="34" rx="7" fill="#161b22" stroke="#f97316" stroke-width="1.4" />
    <text x="80" y="17" class="node-title">Linux (Ubuntu Kernel)</text>
  </g>

  <!-- ==================== BOTTOM HUD STATUS BAR ==================== -->
  <line x1="80" y1="630" x2="840" y2="630" stroke="#30363d" stroke-width="1" />

  <g transform="translate(160, 650)">
    <rect x="0" y="0" width="600" height="42" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="25" cy="21" r="5" fill="#00E89D">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="45" y="25" class="mono" font-size="12" fill="#00E89D" font-weight="bold">SYSTEM STATUS: ALL 24 NODES ACTIVE // LEVEL: SENIOR ARCHITECT</text>
    <rect x="520" y="12" width="60" height="18" rx="4" fill="#00E89D" fill-opacity="0.15" />
    <text x="550" y="24" class="mono" font-size="10" fill="#00E89D" font-weight="bold" text-anchor="middle">100%</text>
  </g>
</svg>
