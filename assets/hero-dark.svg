<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
  <defs>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="term-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
  </defs>

  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes pulse {
      0% { r: 5; opacity: 1; }
      50% { r: 7.5; opacity: 0.35; }
      100% { r: 5; opacity: 1; }
    }
    .cursor { animation: blink 1.1s step-end infinite; }
    .pulse-dot { animation: pulse 2s ease-in-out infinite; }
    .mono { font-family: 'SF Mono', Monaco, 'Fira Code', 'Courier New', monospace; }
  </style>

  <!-- Terminal Window Shell -->
  <rect x="1" y="1" width="898" height="278" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />

  <!-- Window Header Bar -->
  <rect x="1" y="1" width="898" height="38" rx="12" fill="url(#term-header)" />
  <rect x="1" y="26" width="898" height="13" fill="#161b22" />
  <line x1="1" y1="39" x2="899" y2="39" stroke="#30363d" stroke-width="1" />

  <!-- Mac Window Controls -->
  <circle cx="22" cy="20" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="40" cy="20" r="5.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="58" cy="20" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Window Title -->
  <text x="450" y="24" text-anchor="middle" class="mono" font-size="12" fill="#8b949e" letter-spacing="1">anil@architect-terminal ~ bash (zsh)</text>

  <!-- Live Status Badge -->
  <circle cx="810" cy="20" r="4.5" fill="#00E89D" class="pulse-dot" />
  <text x="822" y="24" class="mono" font-size="11" fill="#00E89D" font-weight="bold" letter-spacing="1">SYS://ONLINE</text>

  <!-- Line 1: whoami command -->
  <clipPath id="clip-l1">
    <rect x="32" y="54" width="0" height="28">
      <animate attributeName="width" from="0" to="260" dur="0.6s" begin="0.2s" fill="freeze" />
    </rect>
  </clipPath>
  <g clip-path="url(#clip-l1)">
    <text x="34" y="74" class="mono" font-size="15" fill="#00E5FF" font-weight="bold">$</text>
    <text x="52" y="74" class="mono" font-size="15" fill="#c9d1d9">whoami</text>
  </g>

  <!-- Line 2: Name readout -->
  <clipPath id="clip-l2">
    <rect x="32" y="86" width="0" height="32">
      <animate attributeName="width" from="0" to="480" dur="0.8s" begin="1.0s" fill="freeze" />
    </rect>
  </clipPath>
  <g clip-path="url(#clip-l2)">
    <text x="34" y="108" class="mono" font-size="16" fill="#8b949e">&#x2794;</text>
    <text x="54" y="108" class="mono" font-size="20" fill="#00E5FF" font-weight="bold" filter="url(#cyan-glow)">ANIL PRADHAN</text>
    <text x="210" y="108" class="mono" font-size="13" fill="#8b949e">[Backend Engineer &amp; AI Systems Architect]</text>
  </g>

  <!-- Line 3: inspect role command -->
  <clipPath id="clip-l3">
    <rect x="32" y="124" width="0" height="28">
      <animate attributeName="width" from="0" to="340" dur="0.7s" begin="2.0s" fill="freeze" />
    </rect>
  </clipPath>
  <g clip-path="url(#clip-l3)">
    <text x="34" y="144" class="mono" font-size="15" fill="#00E5FF" font-weight="bold">$</text>
    <text x="52" y="144" class="mono" font-size="15" fill="#c9d1d9">cat mission.spec</text>
  </g>

  <!-- Line 4: Core mission -->
  <clipPath id="clip-l4">
    <rect x="32" y="156" width="0" height="30">
      <animate attributeName="width" from="0" to="820" dur="1.1s" begin="2.9s" fill="freeze" />
    </rect>
  </clipPath>
  <g clip-path="url(#clip-l4)">
    <text x="34" y="177" class="mono" font-size="15" fill="#8b949e">&#x2794;</text>
    <text x="54" y="177" class="mono" font-size="15" fill="#00E89D" font-weight="600">Architecting deterministic multi-agent state machines &amp; high-throughput backends</text>
  </g>

  <!-- Line 5: track records command -->
  <clipPath id="clip-l5">
    <rect x="32" y="194" width="0" height="28">
      <animate attributeName="width" from="0" to="420" dur="0.7s" begin="4.2s" fill="freeze" />
    </rect>
  </clipPath>
  <g clip-path="url(#clip-l5)">
    <text x="34" y="214" class="mono" font-size="15" fill="#00E5FF" font-weight="bold">$</text>
    <text x="52" y="214" class="mono" font-size="15" fill="#c9d1d9">query --accolades --verified</text>
  </g>

  <!-- Line 6: Accolades -->
  <clipPath id="clip-l6">
    <rect x="32" y="226" width="0" height="32">
      <animate attributeName="width" from="0" to="820" dur="1.2s" begin="5.1s" fill="freeze" />
    </rect>
  </clipPath>
  <g clip-path="url(#clip-l6)">
    <text x="34" y="248" class="mono" font-size="15" fill="#8b949e">&#x2794;</text>
    <text x="54" y="248" class="mono" font-size="14" fill="#F5A623" font-weight="bold">&#x1F3C6; Dell FutureMinds Grand Finalist (Top 6/8000+)</text>
    <text x="430" y="248" class="mono" font-size="14" fill="#8b949e">&#x2022;</text>
    <text x="444" y="248" class="mono" font-size="14" fill="#38bdf8">5x Hackathon Builder</text>
    <text x="600" y="248" class="mono" font-size="14" fill="#8b949e">&#x2022;</text>
    <text x="614" y="248" class="mono" font-size="14" fill="#00E89D">218+ LeetCode</text>
  </g>

  <!-- Interactive Terminal Cursor -->
  <rect x="54" y="255" width="9" height="15" fill="#00E5FF" class="cursor">
    <animate attributeName="x" values="54; 116; 116; 178; 178; 260; 260; 740" keyTimes="0; 0.15; 0.35; 0.50; 0.65; 0.80; 0.90; 1" dur="6.5s" fill="freeze" />
    <animate attributeName="y" values="60; 60; 130; 130; 200; 200; 235; 235" keyTimes="0; 0.15; 0.35; 0.50; 0.65; 0.80; 0.90; 1" dur="6.5s" fill="freeze" />
  </rect>
</svg>
