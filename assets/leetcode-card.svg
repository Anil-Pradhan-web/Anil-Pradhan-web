<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 130" width="250" height="130">
  <!-- Background -->
  <rect x="1" y="1" width="248" height="128" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Platform accent dot -->
  <circle cx="20" cy="18" r="4" fill="#FFA116"/>
  <text x="30" y="22" fill="#FFA116" font-size="11" font-weight="bold" font-family="monospace" opacity="0.7">LC</text>

  <!-- Progress ring -->
  <circle cx="125" cy="55" r="30" fill="none" stroke="#FFA116" stroke-width="3" stroke-dasharray="188" stroke-dashoffset="188" opacity="0.15">
    <animate attributeName="stroke-dashoffset" from="188" to="30" dur="1.5s" begin="0.5s" fill="freeze"/>
    <animate attributeName="opacity" from="0.15" to="0.35" dur="1.5s" begin="0.5s" fill="freeze"/>
  </circle>

  <!-- Inner subtle ring -->
  <circle cx="125" cy="55" r="24" fill="none" stroke="#FFA116" stroke-width="1" stroke-dasharray="150" stroke-dashoffset="150" opacity="0.1">
    <animate attributeName="stroke-dashoffset" from="150" to="0" dur="1.8s" begin="0.3s" fill="freeze"/>
    <animate attributeName="opacity" from="0.1" to="0.2" dur="1.8s" begin="0.3s" fill="freeze"/>
  </circle>

  <!-- Big number -->
  <text x="125" y="65" text-anchor="middle" fill="#FFA116" font-size="36" font-weight="bold" font-family="monospace" opacity="0">
    218+
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.8s" fill="freeze"/>
  </text>

  <!-- Accent bar underline -->
  <line x1="85" y1="80" x2="85" y2="80" stroke="#FFA116" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <animate attributeName="x2" from="85" to="165" dur="0.6s" begin="2.1s" fill="freeze"/>
  </line>

  <!-- Label -->
  <text x="125" y="105" text-anchor="middle" fill="#8b949e" font-size="12" font-family="'Segoe UI', sans-serif" opacity="0">
    LeetCode · Problems Solved
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.3s" fill="freeze"/>
  </text>
</svg>
