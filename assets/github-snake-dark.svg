<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" width="880" height="160">
  <defs>
    <filter id="snake-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes snakeMove {
      0% { transform: translate(40px, 40px); }
      25% { transform: translate(320px, 40px); }
      50% { transform: translate(540px, 76px); }
      75% { transform: translate(720px, 50px); }
      100% { transform: translate(820px, 90px); }
    }
    @keyframes eatPulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; fill: #00E5FF; }
    }
    .grid-cell { rx: 2.5; width: 11px; height: 11px; }
    .mono { font-family: 'SF Mono', Monaco, 'Fira Code', 'Courier New', monospace; font-size: 11px; fill: #8b949e; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="878" height="158" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1" />

  <!-- Header -->
  <text x="30" y="24" class="mono" font-weight="bold" fill="#00E5FF">&#x1F40D; CONTRIBUTION GRAPH // SNAKE DISPATCH</text>
  <text x="850" y="24" class="mono" text-anchor="end" fill="#8b949e">1,347+ COMMITS THIS YEAR</text>

  <!-- Contribution Grid Rows -->
  <g transform="translate(30, 36)">
    <!-- Simulated realistic GitHub contribution matrix across 48 columns x 7 rows -->
    <!-- We will draw matrix clusters using patterned rects -->
    <!-- Row 0 to 6 -->
    <!-- Generating rows with varying intensities -->
    <g fill="#161b22">
      <!-- Background empty cells -->
      <pattern id="empty-cells" width="16" height="14" patternUnits="userSpaceOnUse">
        <rect x="0" y="0" width="12" height="11" rx="2.5" fill="#161b22" />
      </pattern>
      <rect x="0" y="0" width="820" height="98" fill="url(#empty-cells)" />
    </g>

    <!-- Active Commit Cells (Shades of Green & Cyan) -->
    <!-- Level 1 (#0e4429) -->
    <g fill="#0e4429">
      <rect x="16" y="0" class="grid-cell" /><rect x="32" y="14" class="grid-cell" /><rect x="48" y="28" class="grid-cell" />
      <rect x="80" y="42" class="grid-cell" /><rect x="112" y="14" class="grid-cell" /><rect x="128" y="0" class="grid-cell" />
      <rect x="160" y="28" class="grid-cell" /><rect x="192" y="70" class="grid-cell" /><rect x="224" y="42" class="grid-cell" />
      <rect x="272" y="14" class="grid-cell" /><rect x="304" y="56" class="grid-cell" /><rect x="336" y="28" class="grid-cell" />
      <rect x="384" y="0" class="grid-cell" /><rect x="416" y="70" class="grid-cell" /><rect x="448" y="42" class="grid-cell" />
      <rect x="496" y="28" class="grid-cell" /><rect x="528" y="56" class="grid-cell" /><rect x="560" y="14" class="grid-cell" />
      <rect x="608" y="0" class="grid-cell" /><rect x="640" y="42" class="grid-cell" /><rect x="672" y="70" class="grid-cell" />
    </g>

    <!-- Level 2 (#006d32) -->
    <g fill="#006d32">
      <rect x="32" y="0" class="grid-cell" /><rect x="48" y="14" class="grid-cell" /><rect x="64" y="28" class="grid-cell" />
      <rect x="96" y="0" class="grid-cell" /><rect x="144" y="14" class="grid-cell" /><rect x="176" y="42" class="grid-cell" />
      <rect x="208" y="28" class="grid-cell" /><rect x="240" y="70" class="grid-cell" /><rect x="288" y="42" class="grid-cell" />
      <rect x="320" y="14" class="grid-cell" /><rect x="352" y="0" class="grid-cell" /><rect x="400" y="42" class="grid-cell" />
      <rect x="432" y="70" class="grid-cell" /><rect x="464" y="28" class="grid-cell" /><rect x="512" y="14" class="grid-cell" />
      <rect x="544" y="42" class="grid-cell" /><rect x="576" y="70" class="grid-cell" /><rect x="624" y="28" class="grid-cell" />
    </g>

    <!-- Level 3 (#26a641) High Activity -->
    <g fill="#26a641">
      <rect x="48" y="0" class="grid-cell" /><rect x="64" y="14" class="grid-cell" /><rect x="80" y="28" class="grid-cell" />
      <rect x="160" y="42" class="grid-cell" /><rect x="224" y="14" class="grid-cell" /><rect x="256" y="28" class="grid-cell" />
      <rect x="304" y="0" class="grid-cell" /><rect x="368" y="42" class="grid-cell" /><rect x="416" y="14" class="grid-cell" />
      <rect x="480" y="42" class="grid-cell" /><rect x="528" y="28" class="grid-cell" /><rect x="592" y="14" class="grid-cell" />
      <rect x="656" y="28" class="grid-cell" /><rect x="704" y="42" class="grid-cell" /><rect x="720" y="14" class="grid-cell" />
      <rect x="736" y="28" class="grid-cell" /><rect x="752" y="42" class="grid-cell" /><rect x="768" y="0" class="grid-cell" />
      <rect x="784" y="14" class="grid-cell" /><rect x="800" y="28" class="grid-cell" />
    </g>

    <!-- Level 4 (#39d353 / #00E89D) Ultra Streak -->
    <g fill="#00E89D">
      <rect x="64" y="0" class="grid-cell" /><rect x="80" y="14" class="grid-cell" /><rect x="96" y="28" class="grid-cell" />
      <rect x="240" y="14" class="grid-cell" /><rect x="256" y="42" class="grid-cell" /><rect x="336" y="14" class="grid-cell" />
      <rect x="448" y="28" class="grid-cell" /><rect x="544" y="14" class="grid-cell" /><rect x="640" y="14" class="grid-cell" />
      <rect x="720" y="28" class="grid-cell" /><rect x="736" y="42" class="grid-cell" /><rect x="752" y="28" class="grid-cell" />
      <rect x="768" y="14" class="grid-cell" /><rect x="784" y="28" class="grid-cell" /><rect x="800" y="42" class="grid-cell" />
    </g>

    <!-- Animated Snake Crawling Through Grid -->
    <g filter="url(#snake-glow)">
      <!-- Snake Head -->
      <rect x="0" y="0" width="13" height="12" rx="3" fill="#00E5FF">
        <animateMotion path="M 10 14 L 160 14 L 160 56 L 380 56 L 380 14 L 560 14 L 560 70 L 760 70 L 760 28 L 810 28" dur="14s" repeatCount="indefinite" />
      </rect>
      <!-- Snake Body 1 -->
      <rect x="0" y="0" width="12" height="11" rx="2.5" fill="#38bdf8">
        <animateMotion path="M 10 14 L 160 14 L 160 56 L 380 56 L 380 14 L 560 14 L 560 70 L 760 70 L 760 28 L 810 28" dur="14s" begin="0.12s" repeatCount="indefinite" />
      </rect>
      <!-- Snake Body 2 -->
      <rect x="0" y="0" width="12" height="11" rx="2.5" fill="#00E89D">
        <animateMotion path="M 10 14 L 160 14 L 160 56 L 380 56 L 380 14 L 560 14 L 560 70 L 760 70 L 760 28 L 810 28" dur="14s" begin="0.24s" repeatCount="indefinite" />
      </rect>
      <!-- Snake Body 3 -->
      <rect x="0" y="0" width="11" height="10" rx="2" fill="#22c55e">
        <animateMotion path="M 10 14 L 160 14 L 160 56 L 380 56 L 380 14 L 560 14 L 560 70 L 760 70 L 760 28 L 810 28" dur="14s" begin="0.36s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(640, 142)">
    <text x="-38" y="9" class="mono" font-size="10">Less</text>
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#161b22" />
    <rect x="14" y="0" width="10" height="10" rx="2" fill="#0e4429" />
    <rect x="28" y="0" width="10" height="10" rx="2" fill="#006d32" />
    <rect x="42" y="0" width="10" height="10" rx="2" fill="#26a641" />
    <rect x="56" y="0" width="10" height="10" rx="2" fill="#00E89D" />
    <text x="74" y="9" class="mono" font-size="10">More</text>
  </g>
</svg>
